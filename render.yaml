services:
  - type: web
    name: second-sight
    env: node
    plan: free
    region: oregon
    buildCommand: "cd server && npm install && npm run build"
    startCommand: "cd server && npm start"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
      - key: HOLD_MINUTES
        value: 1440
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false

